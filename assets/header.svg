    <rect x="0" y="0" width="120" height="212" rx="20" fill="#0E1D31" stroke="#4FA3E0" stroke-width="3"/>
    <rect x="10" y="22" width="100" height="168" rx="6" fill="url(#screen)"/>
    <rect x="44" y="9" width="32" height="5" rx="2.5" fill="#4FA3E0" fill-opacity="0.6"/>
    <rect x="22" y="40" width="76" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="22" y="62" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="22" y="80" width="68" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="22" y="98" width="52" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="22" y="124" width="76" height="40" rx="8" fill="#4FA3E0" fill-opacity="0.35"/>
