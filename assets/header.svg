<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132741"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3E0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4FA3E0" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>

  <!-- dot grid -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <circle cx="720" cy="40" r="2"/><circle cx="750" cy="40" r="2"/><circle cx="780" cy="40" r="2"/><circle cx="810" cy="40" r="2"/>
    <circle cx="720" cy="70" r="2"/><circle cx="750" cy="70" r="2"/><circle cx="780" cy="70" r="2"/><circle cx="810" cy="70" r="2"/>
    <circle cx="720" cy="100" r="2"/><circle cx="750" cy="100" r="2"/><circle cx="780" cy="100" r="2"/><circle cx="810" cy="100" r="2"/>
    <circle cx="720" cy="130" r="2"/><circle cx="750" cy="130" r="2"/><circle cx="780" cy="130" r="2"/><circle cx="810" cy="130" r="2"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="112" fill="#FFFFFF" font-size="56" font-weight="700">Chek Punlork</text>
    <text x="66" y="158" fill="#9CC8EE" font-size="26" font-weight="500">Mobile Engineer · iOS &amp; Android</text>
    <text x="66" y="200" fill="#C9D6E3" font-size="20">Flutter · React Native · Kotlin</text>
    <text x="66" y="232" fill="#8FA3B8" font-size="17">Offline-first apps · Tests · CI/CD · Phnom Penh (UTC+7)</text>
  </g>

  <!-- phone with sync -->
